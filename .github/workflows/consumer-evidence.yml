name: Migrated consumer evidence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  canonical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q -c /dev/null tests/test_mod_consumer_capsule.py tests/test_migrated_evidence_boundary.py tests/test_collection_evidence_boundary.py
      - name: Verify canonical archive and every original member
        run: python scripts/fetch_mod_consumer_evidence.py --destination "$RUNNER_TEMP/consumer-evidence"
      - name: Verify historical capsule and every original member
        run: python scripts/fetch_mod_consumer_evidence.py --config BENCHMARK_HISTORY.json --destination "$RUNNER_TEMP/history-evidence"
      - name: Verify remaining collection and every original member
        run: python scripts/fetch_mod_consumer_evidence.py --config BENCHMARK_COLLECTION.json --destination "$RUNNER_TEMP/collection-evidence"
      - name: Check claim links and preserved limitations against verified originals
        env:
          BENCHMARK_EVIDENCE_ROOT: ${{ runner.temp }}/consumer-evidence
          BENCHMARK_HISTORY_ROOT: ${{ runner.temp }}/history-evidence
          BENCHMARK_COLLECTION_ROOT: ${{ runner.temp }}/collection-evidence
          VERIFY_PROTOCOL_ORIGINALS: '1'
        run: python -m pytest -q -c /dev/null tests/test_claim_evidence_bindings.py tests/test_protocol_evidence.py tests/test_runbook_evidence.py
      - name: Verify research archive and paper consumers
        env:
          BENCHMARK_RESEARCH_ROOT: ${{ runner.temp }}/research-evidence
          BENCHMARK_EVIDENCE_ROOT: ${{ runner.temp }}/consumer-evidence
          BENCHMARK_HISTORY_ROOT: ${{ runner.temp }}/history-evidence
          BENCHMARK_COLLECTION_ROOT: ${{ runner.temp }}/collection-evidence
          VERIFY_PROTOCOL_ORIGINALS: '1'
        run: |
          python scripts/fetch_mod_consumer_evidence.py --config BENCHMARK_RESEARCH.json --destination "$BENCHMARK_RESEARCH_ROOT"
          PYTHONPATH=src python -m pytest -q -c /dev/null tests/test_research_paper_custody.py tests/test_notes_evidence.py tests/test_entry_evidence.py tests/test_m0_consumer_custody.py tests/test_active_cli_consumers.py
