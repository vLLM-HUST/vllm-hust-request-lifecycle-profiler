name: ECPA bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest ruff build
      - run: >-
          python -m pytest -q tests/test_ecpa_manifest.py
          tests/test_plugin.py tests/test_native_event_bus.py
          tests/test_runtime_protocol.py
      - run: >-
          python -m ruff check --select E9,F63,F7,F82
          src/vllm_request_lifecycle_profiler tests/test_ecpa_manifest.py
          tests/test_plugin.py tests/test_native_event_bus.py
      - run: python -m build --wheel
      - name: Verify clean-wheel activation and rollback lifecycle
        if: matrix.python == '3.12'
        run: |
          git clone --filter=blob:none \
            https://github.com/vLLM-HUST/extension-manager.git /tmp/ecpa-manager
          git -C /tmp/ecpa-manager checkout \
            26511210709ccfa711c6a150acab81771669f49d
          python -m build --wheel --outdir /tmp/ecpa-dist /tmp/ecpa-manager
          python -m venv /tmp/ecpa-profiler
          /tmp/ecpa-profiler/bin/pip install \
            /tmp/ecpa-dist/vllm_hust_ext-*.whl dist/*.whl
          export XDG_CONFIG_HOME=/tmp/ecpa-state/config
          export XDG_STATE_HOME=/tmp/ecpa-state/state
          export XDG_CACHE_HOME=/tmp/ecpa-state/cache
          cli=/tmp/ecpa-profiler/bin/vllm-hust-ext
          id=org.vllm-hust.request-lifecycle-profiler
          "$cli" extension list | grep "$id 0.1.1 disabled"
          "$cli" extension inspect "$id" | grep '"activation_ready": true'
          "$cli" extension validate "$id" >/dev/null
          "$cli" extension check "$id" | grep '"degraded"'
          "$cli" extension enable "$id"
          "$cli" extension plan "$id" | grep '"operation": "configure_launch"'
          "$cli" extension render "$id" | grep 'request_lifecycle_profiler'
          if "$cli" run --dry-run -- python -c pass; then
            echo 'unverified host was unexpectedly accepted' >&2
            exit 1
          fi
          if "$cli" extension status "$id" | grep -q 'runtime_effective'; then
            echo 'runtime_effective was inferred without callback evidence' >&2
            exit 1
          fi
          "$cli" extension disable "$id"
          "$cli" extension forget "$id"
          /tmp/ecpa-profiler/bin/pip uninstall -y \
            vllm-request-lifecycle-profiler-plugin
          if "$cli" extension list | grep -q "$id"; then
            echo 'uninstalled Bundle remains discoverable' >&2
            exit 1
          fi
