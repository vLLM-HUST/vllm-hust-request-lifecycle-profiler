name: v4.4 idle-evidence fresh-clone audit

on:
  push:
    branches:
      - main
      - feat/host-device-clock-calibration
    paths:
      - ".benchmarks/**"
      - ".github/workflows/idle-evidence-v44.yml"
      - "docs/**"
      - "Makefile"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".benchmarks/**"
      - ".github/workflows/idle-evidence-v44.yml"
      - "docs/**"
      - "Makefile"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract and report gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out authority repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python3 -m pip install pytest

      - name: Validate v4.4 contract and report fail-closed gates
        run: |
          PYTHONPATH=src python3 -m pytest -q \
            tests/test_clock_markers.py \
            tests/test_clock_calibration_analyzers.py \
            tests/test_idle_evidence_fresh_clone.py \
            tests/test_repeated_clock_marker_overhead_ab.py

  parent-tests:
    name: Complete parent test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out authority repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact G1 runtime history
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust
          ref: 5f7872976bd56a0861bb0072eaac68260ba7d578
          path: _deps/vllm-hust-g1
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python3 -m pip install pytest regex

      - name: Run complete parent tests
        env:
          VLLM_HUST_G1_SRC: ${{ github.workspace }}/_deps/vllm-hust-g1
        run: PYTHONPATH=src python3 -m pytest -q

  raw-cross-clock-audit:
    name: Raw input, hash, and cross-clock reconstruction
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out authority repository
        uses: actions/checkout@v4

      - name: Check out pinned analyzer
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-perf-analyzer
          ref: 9a816aaeda5d937c07d04e13901df1462d12f979
          path: _deps/vllm-hust-perf-analyzer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++-12 libsqlite3-dev

      - name: Build pinned analyzer with SQLite adapters
        run: |
          cmake \
            -S _deps/vllm-hust-perf-analyzer \
            -B _deps/vllm-hust-perf-analyzer/build/fresh-clone \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DTRACELOOM_NATIVE_BUILD_TESTS=OFF \
            -DTRACELOOM_NATIVE_ENABLE_ASCEND_SQLITE=ON
          cmake \
            --build _deps/vllm-hust-perf-analyzer/build/fresh-clone \
            --target traceloom \
            --parallel 2
          test -x _deps/vllm-hust-perf-analyzer/build/fresh-clone/native/traceloom

      - name: Regenerate and audit serving and calibration sidecars
        run: |
          python3 .benchmarks/verify_idle_evidence_fresh_clone.py \
            --analyzer-repo _deps/vllm-hust-perf-analyzer \
            --traceloom _deps/vllm-hust-perf-analyzer/build/fresh-clone/native/traceloom
