name: v4.4 idle-evidence fresh-clone audit

on:
  pull_request:
    paths:
      - ".benchmarks/analyze_npu6_clock_marker_overhead_ab.py"
      - ".benchmarks/analyze_repeated_clock_marker_overhead_ab.py"
      - ".benchmarks/build_idle_evidence_fresh_clone_bundle.py"
      - ".benchmarks/verify_idle_evidence_fresh_clone.py"
      - ".benchmarks/results/npu6_clock_marker_overhead_v44_l0_repeated_ab/**"
      - ".github/workflows/idle-evidence-v44.yml"
      - "docs/claim_ledger.md"
      - "docs/host_device_clock_calibration.md"
      - "Makefile"
      - "tests/test_clock_calibration_analyzers.py"
      - "tests/test_idle_evidence_fresh_clone.py"
      - "tests/test_repeated_clock_marker_overhead_ab.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-idle-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out authority repository
        uses: actions/checkout@v4

      - name: Check out pinned analyzer
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-perf-analyzer
          ref: 9a816aaeda5d937c07d04e13901df1462d12f979
          path: _deps/vllm-hust-perf-analyzer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pinned analyzer with SQLite adapters
        run: |
          cmake \
            -S _deps/vllm-hust-perf-analyzer \
            -B _deps/vllm-hust-perf-analyzer/build/fresh-clone \
            -DTRACELOOM_NATIVE_BUILD_TESTS=OFF \
            -DTRACELOOM_NATIVE_ENABLE_ASCEND_SQLITE=ON
          cmake \
            --build _deps/vllm-hust-perf-analyzer/build/fresh-clone \
            --target traceloom \
            --parallel 2

      - name: Regenerate and audit all six accepted sidecars
        run: |
          python .benchmarks/verify_idle_evidence_fresh_clone.py \
            --analyzer-repo _deps/vllm-hust-perf-analyzer \
            --traceloom _deps/vllm-hust-perf-analyzer/build/fresh-clone/native/traceloom

      - name: Run report and bundle regression tests
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q \
            tests/test_clock_calibration_analyzers.py \
            tests/test_idle_evidence_fresh_clone.py \
            tests/test_repeated_clock_marker_overhead_ab.py
