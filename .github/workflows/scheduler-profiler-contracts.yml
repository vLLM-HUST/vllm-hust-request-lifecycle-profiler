name: Scheduler profiler contracts

on:
  pull_request:
    paths:
      - ".github/workflows/scheduler-profiler-contracts.yml"
      - "contracts/p1/fixtures/scheduler-profile-v1alpha1/**"
      - "contracts/p1/scheduler-profile-approval-candidate.json"
      - "contracts/p1/scheduler-profile-config.v1alpha1.json"
      - "contracts/p1/scheduler-profile-multistream-overlay.v1alpha1-draft.md"
      - "contracts/p1/scheduler-profile.v1alpha1-draft.md"
      - "scripts/verify_scheduler_profile_contract.py"
      - "tests/test_scheduler_profile_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-clone-contracts:
    name: fresh-clone-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only verification dependencies
        run: python -m pip install pytest==9.1.1 ruff==0.16.2
      - name: Verify frozen candidate bytes
        run: python -B scripts/verify_scheduler_profile_contract.py --json
      - name: Run contract unit tests
        run: PYTHONPATH=src python -B -m pytest -q tests/test_scheduler_profile_contract.py
      - name: Lint contract verifier and tests
        run: python -m ruff check scripts/verify_scheduler_profile_contract.py tests/test_scheduler_profile_contract.py

  self-contained-cpu-suite:
    name: self-contained-cpu-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only test dependency
        run: python -m pip install pytest==9.1.1
      - name: Run tests that do not require the private workload gitlink
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m pytest -q --ignore=tests/test_shared_workloads.py
